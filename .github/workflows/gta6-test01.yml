name: GTA6 Test 01 - Windows experimental build

on:
  workflow_dispatch:
  push:
    branches: [gta6-test-01]

permissions:
  contents: read

concurrency:
  group: gta6-test01-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Select Visual Studio Clang
        shell: pwsh
        run: |
          Join-Path $env:VCINSTALLDIR 'Tools\Llvm\x64\bin' |
            Out-File $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install shader compiler
        shell: pwsh
        run: |
          $vcpkgRoot = Split-Path (Get-Command vcpkg).Source
          vcpkg install 'glslang[tools,opt]:x64-windows'
          if ($LASTEXITCODE -ne 0) { throw 'glslang installation failed' }
          "$vcpkgRoot\installed\x64-windows\tools\glslang" |
            Out-File $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure headless emulator and tests
        shell: pwsh
        run: |
          cmake -S . -B _Build/gta6-test01 -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=OFF `
            -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl `
            -DKYTY_BUILD_LAUNCHER=OFF -DBUILD_TESTING=ON `
            -DKYTY_BUILD_ORIGIN=Fork "-DKYTY_BUILD_REPOSITORY=$env:GITHUB_REPOSITORY"
          if ($LASTEXITCODE -ne 0) { throw 'CMake configuration failed' }

      - name: Build emulator and regression test
        shell: pwsh
        run: |
          cmake --build _Build/gta6-test01 --target kyty_emulator fault_diagnostics_tests --parallel 3
          if ($LASTEXITCODE -ne 0) { throw 'Windows compilation failed' }

      - name: Test stack-boundary diagnostics
        shell: pwsh
        run: |
          ctest --test-dir _Build/gta6-test01 --output-on-failure -R '^fault_diagnostics$'
          if ($LASTEXITCODE -ne 0) { throw 'Regression test failed' }

      - name: Verify test executable and CLI
        shell: pwsh
        run: |
          $helpText = & _Build/gta6-test01/kyty_emulator.exe --help 2>&1
          if ($LASTEXITCODE -ne 0) { throw 'Emulator help smoke test failed' }
          if (($helpText -join "`n") -notmatch 'GTA6 Gameplay Test 01') { throw 'Test banner absent' }
          $helpText | Set-Content _Build/gta6-test01/help-check.txt

      - name: Install and assemble test package
        shell: pwsh
        run: |
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist/GTA6-Test01'
          New-Item -ItemType Directory -Force $dist | Out-Null
          cmake --install _Build/gta6-test01 --prefix "$dist/patched"
          if ($LASTEXITCODE -ne 0) { throw 'Runtime installation failed' }
          Copy-Item contrib/gta6-test01/* $dist -Recurse -Force
          Copy-Item LICENSE "$dist/LICENSE"
          New-Item -ItemType Directory -Force "$dist/source" | Out-Null
          git diff --binary 61db2f8874d4a94fd2908a87cefa973ddc48ef6e HEAD --output="$dist/source/gta6-test01.patch"
          if ($LASTEXITCODE -ne 0) { throw 'Source patch export failed' }
          git archive HEAD --format=zip --output="$dist/source/corresponding-source.zip"
          if ($LASTEXITCODE -ne 0) { throw 'Source archive export failed' }
          $commit = git rev-parse HEAD
          @(
            "Repository: $env:GITHUB_REPOSITORY"
            "Commit: $commit"
            "Workflow run: https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            'Windows compilation, stack regression test, and --help smoke test passed.'
            'GTA6 gameplay and graphics correctness remain unverified.'
          ) | Set-Content "$dist/BUILD-RESULT.txt"
          Get-ChildItem "$dist/patched" -File -Recurse | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $($_.Path.Substring($dist.Length + 1))" } |
            Set-Content "$dist/SHA256SUMS.txt"
          Copy-Item _Build/gta6-test01/help-check.txt "$dist/CLI-CHECK.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: GTA6-Test01-Windows
          path: dist/GTA6-Test01/**
          if-no-files-found: error
          retention-days: 14
